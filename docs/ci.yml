# ============================================================================
# GitHub Actions workflow for ctxpack.
#
# This file lives in docs/ on purpose. It is NOT active.
#
# Activating it
# -------------
#   git mv docs/ci.yml .github/workflows/ci.yml
#   git commit -am "ci: activate GitHub Actions workflow"
#   git push
#
# It only runs once it is under .github/workflows/. Until then the checks it
# describes are available locally: `make check` (see the Makefile) for the
# gate - gofmt cleanliness, go vet, the test suite, and the stdlib-only
# assertion that go.sum stays empty and `go list -m all` reports exactly one
# module - and `make smoke` for the CLI exercise below. `make ci` runs both
# plus the local audits.
#
# A workflow that never runs rots silently - a shell block that no longer
# parses, a script that was moved, a gate that quietly drifts from the local
# one. So this file is audited locally instead: `make cicheck`, which runs
# scripts/check-ci.sh, bash -n's every run: block, checks that every script
# and Make target named here exists, and fails if a gate primitive drifts
# between this file and `make check`.
#
# Why it is here rather than there
# --------------------------------
# This repository was published by an automation token that does not carry the
# `workflow` scope. GitHub refuses any push or Contents-API write that creates
# or updates a file under .github/workflows/ without that scope:
#
#   ! [remote rejected] main -> main (refusing to allow an OAuth App to create
#     or update workflow `.github/workflows/ci.yml` without `workflow` scope)
#
# The workaround is one interactive command that needs a browser, which the
# publishing environment does not have:
#
#   gh auth refresh -h github.com -s workflow
#
# Keeping the definition versioned here means the content is reviewed and
# diffable now instead of being assembled from scratch later.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · go${{ matrix.go }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # The module declares go 1.21 and depends on nothing, so a build must
      # never need to fetch a different toolchain. Fail loudly if it would.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.21 is the declared minimum (go.mod); the upper end tracks current
        # releases. Nothing in the module can require a newer toolchain, so a
        # failure on any row means a real regression, not an upgrade.
        go: ["1.21", "1.22", "1.23", "1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # No module cache to warm: the module has zero dependencies, so the
          # cache would only ever hold the stdlib and add minutes of I/O.
          cache: false

      - name: Check no dependencies
        shell: bash
        run: test ! -s go.sum && go list -m all | wc -l | grep -q '^1$'

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -v

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          # Build into a throwaway dir, not ./ctxpack. A Linux or macOS runner
          # would leave an untracked binary next to main.go - .gitignore covers
          # *.exe, not an extensionless name - and a local run would drop it
          # inside the source tree. The script then drives every command, flag,
          # format, the diff range and deleted-file cases, and the MCP server
          # against the tree, so this step stays short and cannot drift from
          # the local `make smoke` target, which calls the same script.
          B=$(mktemp -d)/ctxpack
          case "$RUNNER_OS" in Windows) B="$B.exe" ;; esac
          go build -o "$B" .
          bash scripts/smoke.sh "$B"

      - name: local audits
        shell: bash
        run: |
          # The remaining `make ci` guards, run exactly as a local checkout
          # would: documented commands, installer cross-checks, example
          # snapshots, and the workflow's own gate (which audits this file).
          set -euo pipefail
          bash scripts/check-commands.sh
          bash scripts/check-installers.sh
          bash scripts/check-examples.sh
          bash scripts/check-ci.sh

      - name: verify the ldflags version stamp
        shell: bash
        run: |
          # -ldflags -X does nothing at all for a mistyped path — it silently
          # leaves the source default in place. Build with a sentinel version
          # and assert it actually landed.
          set -euo pipefail
          B=$(mktemp -d)/ctxpack
          case "$RUNNER_OS" in Windows) B="$B.exe" ;; esac
          go build -ldflags "-X github.com/la2278647-arch/ctxpack/internal/version.Version=9.9.9-sentinel" -o "$B" .
          OUT="$("$B" version)"
          case "$OUT" in
            *"ctxpack 9.9.9-sentinel"*) echo "stamp ok: $OUT" ;;
            *) echo "version stamp missing from: $OUT"; exit 1 ;;
          esac

  packages:
    name: release binaries
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    # Top-level permissions below grant only contents: read. Uploading an
    # artifact needs actions: write, so this job declares it itself rather than
    # widening the whole workflow.
    permissions:
      contents: read
      actions: write
    env:
      # Same as the test job: never fetch a toolchain from the network.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: "386" }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          # Same naming as `make release`, the published release assets, and
          # install.sh, so a CI artifact can stand in for a release download.
          EXE=ctxpack_${VERSION#v}_${GOOS}_${GOARCH}
          if [ "$GOOS" = "windows" ]; then EXE="$EXE.exe"; fi
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          go build -trimpath -ldflags "-s -w \
            -X github.com/la2278647-arch/ctxpack/internal/version.Version=$VERSION \
            -X github.com/la2278647-arch/ctxpack/internal/version.BuildCommit=$COMMIT \
            -X github.com/la2278647-arch/ctxpack/internal/version.BuildDate=$DATE" \
            -o "dist/$EXE" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  checksum:
    name: checksums
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksum
        shell: bash
        run: |
          # Same text-mode manifest as `make release`, install.sh and
          # install.ps1: each installer parses this exact format, so the
          # artifact tree must reproduce it byte for byte.
          cd dist
          sha256sum -t * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist-with-checksums
          path: dist/*
